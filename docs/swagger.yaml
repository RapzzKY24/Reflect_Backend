basePath: /api/v1
definitions:
  internal_modules_address.AddressResponse:
    properties:
      city:
        type: string
      created_at:
        type: string
      district:
        type: string
      full_address:
        type: string
      id:
        type: string
      is_primary:
        type: boolean
      label:
        type: string
      phone_number:
        type: string
      postal_code:
        type: string
      province:
        type: string
      recipient_name:
        type: string
      updated_at:
        type: string
    type: object
  internal_modules_address.CreateAddressRequest:
    properties:
      city:
        type: string
      district:
        type: string
      full_address:
        type: string
      is_primary:
        type: boolean
      label:
        type: string
      phone_number:
        type: string
      postal_code:
        type: string
      province:
        type: string
      recipient_name:
        type: string
    required:
    - city
    - district
    - full_address
    - phone_number
    - postal_code
    - province
    - recipient_name
    type: object
  internal_modules_address.UpdateAddressRequest:
