    - quantity
    type: object
  internal_modules_cart.CartItemResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      image:
        type: string
      name:
        type: string
      price:
        type: integer
      product_id:
        type: string
      quantity:
        type: integer
      slug:
        type: string
      stock:
        type: integer
      stock_status:
        type: string
      subtotal:
        type: integer
      updated_at:
        type: string
    type: object
  internal_modules_cart.CartResponse:
    properties:
      items:
        items:
