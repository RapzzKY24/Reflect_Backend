host: localhost:8080
info:
  contact: {}
  description: E-commerce REST API built with Go, Gin, GORM, JWT, and Cloudinary
  title: Reflect Backend API
  version: "1.0"
paths:
  /addresses:
    get:
      description: Retrieve all saved addresses for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/reflect-backend_internal_utils.SwaggerSuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_modules_address.AddressResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/reflect-backend_internal_utils.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Get my addresses
      tags:
      - Addresses
    post:
      consumes:
      - application/json
      description: Create a new shipping address for the authenticated user
      parameters:
      - description: Create Address Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_address.CreateAddressRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/reflect-backend_internal_utils.SwaggerSuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_address.AddressResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/reflect-backend_internal_utils.SwaggerValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/reflect-backend_internal_utils.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Create address
      tags:
      - Addresses
  /addresses/{id}:
    delete:
      description: Delete a shipping address by ID
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/reflect-backend_internal_utils.SwaggerSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/reflect-backend_internal_utils.SwaggerErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/reflect-backend_internal_utils.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete address
      tags:
      - Addresses
    put:
      consumes:
