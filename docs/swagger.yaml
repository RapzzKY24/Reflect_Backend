      id:
        type: string
      image:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  internal_modules_category.CreateCategoryRequest:
    properties:
      description:
        type: string
      image:
        type: string
      is_active:
        type: boolean
      name:
